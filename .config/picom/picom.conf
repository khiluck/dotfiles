# picom — замена xcompmgr. Главное отличие: перерисовывает GPU-ускоренные окна
# (видео в браузере, mpv-камера) на полной частоте, поэтому запись экрана
# (x11grab) больше не «застывает» на движущемся видео.
backend = "glx";
vsync = true;

# Прозрачность окон задаётся через _NET_WM_WINDOW_OPACITY (dmenu, st, pauzer её
# ставят) — picom уважает её по умолчанию. Ничего лишнего не добавляем.
shadow = false;
fading = false;
detect-client-opacity = true;
