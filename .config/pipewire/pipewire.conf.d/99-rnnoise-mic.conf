# RNNoise — системное шумоподавление микрофона (аналог «Microphone Enhancements»
# в Windows). Создаёт виртуальный источник "Noise Canceling Source": его capture
# берёт реальный микрофон, прогоняет через нейросетевой шумодав RNNoise, и отдаёт
# наружу чистый сигнал. Приложения (и запись экрана) выбирают его как микрофон;
# если сделать его источником по умолчанию — чистится звук везде: звонки, встречи,
# запись.
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise Canceling Source"
            media.name       = "Noise Canceling Source"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"     = 50.0
                            "VAD Grace Period (ms)" = 200
                        }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.rnnoise_source"
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name   = "rnnoise_source"
                media.class = Audio/Source
                audio.rate  = 48000
            }
        }
    }
]
